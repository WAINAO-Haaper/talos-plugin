<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>TALOS 新对话欢迎词 QA</title>
	<link rel="stylesheet" href="../styles.css">
	<style>
		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #171717; }
		.compare { display: grid; grid-template-columns: 545px 545px; width: 1090px; height: 981px; }
		.reference { width: 545px; height: 981px; object-fit: none; object-position: right top; background: #f1ede3; }
		.implementation { width: 545px; height: 981px; overflow: hidden; background: #f1ede3; }
		.workspace-leaf-content, .view-content { width: 100%; height: 100%; }
		.jv-panel { margin: 0 !important; border-radius: 0 !important; }
		@media (max-width: 600px) {
			.compare { display: block; width: 100%; height: 100%; }
			.reference { display: none; }
			.implementation { width: 100%; height: 100%; }
		}
	</style>
</head>
<body>
	<main class="compare">
		<img class="reference" src="http://127.0.0.1:8766/talos-welcome-comparison.png" alt="修改前欢迎词参考">
		<section class="implementation workspace-leaf-content" data-type="talos-jarvis-view">
			<div class="view-content">
				<div class="talos-console talos-jarvis-pane theme-geometric-modern page-jarvis">
					<section class="panel jv-panel jv-agent">
						<div class="section-title"><h2>屈原 · AGENTIC</h2></div>
						<div class="jv-statusbar">
							<div class="jv-status" data-state="idle">待命</div>
							<div class="jv-modewrap"><span class="jv-modelabel">权限</span><select class="jv-modesel"><option>每次询问</option></select></div>
							<div class="jv-capsbtn">能力</div>
						</div>
						<div class="jv-tabsbar">
							<div class="jv-tab is-active"><span class="jv-tab-num">1</span><span class="jv-tab-title">新对话</span><span class="jv-tab-close">×</span></div>
							<div class="jv-tab jv-tab-add">＋</div>
						</div>
						<div class="jv-tabscontent">
							<div class="jv-log jv-agentlog">
								<div class="empty jv-welcome">
									<div class="jv-welcome-card">
										<div class="jv-welcome-eyebrow">屈原 · 新对话</div>
										<strong class="jv-welcome-title">来，落一笔。</strong>
										<div class="jv-welcome-subtitle">剩下的，我们一起想透。</div>
									</div>
								</div>
							</div>
						</div>
						<div class="jv-inputbar">
							<textarea class="jv-input" rows="2" placeholder="问屈原，@引用文件、可贴图…（Enter 发送，Shift+Enter 换行）"></textarea>
							<div class="jv-btns">
								<button class="jv-btn">图</button>
								<button class="jv-btn jv-mic">语音</button>
								<button class="jv-btn">停</button>
								<button class="jv-btn jv-send">发送</button>
							</div>
						</div>
						<div class="jv-bottombar">
							<select class="jv-modelsel"><option>CLI 默认</option></select>
							<div class="jv-thinkwrap"><span class="jv-bl">思考</span><select class="jv-thinksel"><option>高</option></select></div>
							<div class="jv-voicewrap"><span class="jv-bl">语音</span><input class="jv-yolo jv-voice-toggle" type="checkbox" aria-label="语音助手开关"></div>
							<div class="jv-ctx">0%</div>
							<div class="jv-yolowrap"><span class="jv-bl">YOLO</span><input class="jv-yolo" type="checkbox"></div>
						</div>
					</section>
				</div>
			</div>
		</section>
	</main>
	<script>
		const voiceToggle = document.querySelector(".jv-voice-toggle");
		const micButton = document.querySelector(".jv-mic");
		const syncVoice = () => {
			micButton.disabled = !voiceToggle.checked;
			micButton.title = voiceToggle.checked ? "" : "先开启底栏「语音」开关";
		};
		voiceToggle.addEventListener("change", syncVoice);
		syncVoice();
	</script>
</body>
</html>
